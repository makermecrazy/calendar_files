name: Publish Year 2 Calendar

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-year2-calendar.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write final ICS
        shell: bash
        env:
          ICS_GZ_B64: 
          
        run: |
          printf '%s' "$ICS_GZ_B64" | base64 -d | gzip -d > Solano_Year_2_FINAL_2026-2027.ics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Solano_Year_2_FINAL_2026-2027.ics
          git commit -m 'Publish final Solano Year 2 calendar'
          git push
