name: Rebuild both subscription calendars
on:
  push:
    paths:
      - '.github/workflows/rebuild-both-subscriptions.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Year 1 and Year 2
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime

          BASE='https://raw.githubusercontent.com/makermecrazy/calendar_files/main'
          CHURCH='San Francisco Solano Catholic Church, 22082 Antonio Pkwy, Rancho Santa Margarita, CA 92688'
          HALL='Solano Hall - '+CHURCH
          YOUTH='Youth Room - '+CHURCH
          SY='https://www.solanocatholic.org/solanoyouth'
          CONF='https://www.solanocatholic.org/confirmation'
          SIGN='https://m.signupgenius.com/#!/showSignUp/10C0A45A9A92BA2F85-63825727-meals?useFullSite=false'
          ENR=['20260927','20261004','20261018','20261025','20261108','20261122','20261206','20261213','20261220','20270110','20270124','20270131','20270221','20270307','20270321','20270404','20270411','20270418']
          SUM=['20260823','20260830','20260906','20260913','20260920','20260927','20261004','20261011','20261018','20261025','20261101','20261108','20261122','20261129','20261206','20261213','20261220','20270110','20270117','20270124','20270131','20270221','20270228','20270307','20270321','20270404','20270411','20270418','20270425','20270502','20270516','20270523','20270530']

          def esc(s):
              return s.replace('\\','\\\\').replace(';','\\;').replace(',','\\,').replace('\n','\\n')
          def fold(line, limit=73):
              out=[]; cur=''; maxb=limit
              for ch in line:
                  if len((cur+ch).encode('utf-8')) > maxb:
                      out.append(cur); cur=ch; maxb=limit-1
                  else: cur += ch
              out.append(cur)
              return '\r\n '.join(out)
          def docs(year, due=False):
              packet=f'{BASE}/Solano_Youth_Confirmation_Year_{year}_Packet_2026-2027.pdf'
              cal=f'{BASE}/Solano_Year_{year}_Calendar_2026-2027.pdf'
              a=[f'DOCUMENTS\nComplete Year {year} Packet:\n{packet}',f'Year {year} Calendar:\n{cal}']
              if due:
                  a += [f'Service Project Form:\n{BASE}/Solano_Service_Project_Form.pdf',f'Sponsorship Instructions + Form:\n{BASE}/Solano_Confirmation_Sponsorship_Instructions_and_Form.pdf']
              a += [f'SOLANO LINKS\nSolano Youth:\n{SY}',f'Confirmation:\n{CONF}',f'Summit Meal and Service Signup:\n{SIGN}','CONTACT\nMatt Franklin - Youth Ministry Coordinator\n949-589-1709 x2138\nmfranklin@solanocatholic.org\nsolanoyouth@solanocatholic.org']
              return '\n\n'.join(a)
          def attaches(year, due=False):
              urls=[f'{BASE}/Solano_Youth_Confirmation_Year_{year}_Packet_2026-2027.pdf',f'{BASE}/Solano_Year_{year}_Calendar_2026-2027.pdf']
              if due: urls += [f'{BASE}/Solano_Service_Project_Form.pdf',f'{BASE}/Solano_Confirmation_Sponsorship_Instructions_and_Form.pdf']
              return [f'ATTACH;VALUE=URI;FMTTYPE=application/pdf:{u}' for u in urls]
          def alarm(lines, trig):
              lines += ['BEGIN:VALARM','ACTION:DISPLAY',f'TRIGGER:{trig}','DESCRIPTION:Solano event reminder','END:VALARM']
          def event(uid, summary, start, end, desc, loc=None, year=1, due=False, special_alert=None, date_only=False):
              L=['BEGIN:VEVENT',f'UID:{uid}','DTSTAMP:20260914T230000Z','LAST-MODIFIED:20260914T230000Z','SEQUENCE:3']
              if date_only:
                  L += [f'DTSTART;VALUE=DATE:{start}',f'DTEND;VALUE=DATE:{end}']
              else:
                  L += [f'DTSTART;TZID=America/Los_Angeles:{start}',f'DTEND;TZID=America/Los_Angeles:{end}']
              L += [f'SUMMARY:{esc(summary)}']
              if loc: L += [f'LOCATION:{esc(loc)}']
              L += [f'DESCRIPTION:{esc(desc)}',f'URL:{CONF}'] + attaches(year,due)
              if special_alert=='retreat':
                  alarm(L,'-P1D'); alarm(L,'-PT2H')
              elif special_alert=='due1':
                  L += ['BEGIN:VALARM','ACTION:DISPLAY','TRIGGER;VALUE=DATE-TIME:20270503T160000Z','DESCRIPTION:Solano requirements due in 1 week','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','TRIGGER;VALUE=DATE-TIME:20270508T160000Z','DESCRIPTION:Solano requirements due in 2 days','END:VALARM']
              elif special_alert=='due2':
                  L += ['BEGIN:VALARM','ACTION:DISPLAY','TRIGGER;VALUE=DATE-TIME:20270328T160000Z','DESCRIPTION:Solano requirements due in 1 week','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','TRIGGER;VALUE=DATE-TIME:20270402T160000Z','DESCRIPTION:Solano requirements due in 2 days','END:VALARM']
              else:
                  alarm(L,'-PT2H'); alarm(L,'-PT30M')
              L += ['END:VEVENT']
              return L
          def build(year):
              L=['BEGIN:VCALENDAR','VERSION:2.0',f'PRODID:-//MakerMeCrazy//Solano Year {year} Subscription//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',f'X-WR-CALNAME:Solano Confirmation Year {year} + Summit 2026-2027','X-WR-TIMEZONE:America/Los_Angeles','REFRESH-INTERVAL;VALUE=DURATION:PT6H','X-PUBLISHED-TTL:PT6H','BEGIN:VTIMEZONE','TZID:America/Los_Angeles','BEGIN:DAYLIGHT','TZOFFSETFROM:-0800','TZOFFSETTO:-0700','TZNAME:PDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:-0700','TZOFFSETTO:-0800','TZNAME:PST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD','END:VTIMEZONE']
              for i,d in enumerate(ENR,1):
                  desc=f'Enrichment #{i}. 4:00-6:00 PM. Includes Mass. Must attend 15 Enrichments.\n\n'+docs(year)
                  L += event(f'solano-y{year}-enrichment-{i}-{d}@makermecrazy',f'Solano Year {year} Enrichment #{i}',d+'T160000',d+'T180000',desc,HALL,year)
              for i,d in enumerate(SUM,1):
                  desc='Summit Youth Group. 6:00-8:30 PM. Dinner is provided. Bring a meal to Summit or Garden+Garage for Service Hours. Students must prepare, serve and clean up and stay for the entire Summit youth group = 5 hrs/meal.\n\n'+docs(year)
                  L += event(f'solano-y{year}-summit-{d}@makermecrazy',f'Solano Summit - Year {year}',d+'T180000',d+'T203000',desc,YOUTH,year)
              for d,st,en,opt in [('20260913','113000','130000','Sunday Option'),('20260914','190000','203000','Monday Option')]:
                  desc='CHOOSE ONE meeting option. Both students and parents attend together.\n\n'+docs(year)
                  L += event(f'solano-y{year}-parent-student-meeting-{d}@makermecrazy',f'Solano Year {year} Parent + Student Meeting - CHOOSE ONE - {opt}',d+'T'+st,d+'T'+en,desc,CHURCH,year)
              for d in ['20261101','20270228']:
                  desc='Parent + Student Day Retreat. 2:00-5:00 PM.\n\n'+docs(year)
                  L += event(f'solano-y{year}-parent-student-day-{d}@makermecrazy',f'Solano Year {year} Parent + Student Day Retreat',d+'T140000',d+'T170000',desc,CHURCH,year)
              if year==1:
                  desc='Year 1 Retreat. Friday Nov. 13 at 5:30 PM through Sunday Nov. 15 at 11:30 AM. Location is not listed in the source packet and will be added when confirmed.\n\n'+docs(1)
                  L += event('solano-y1-retreat-20261113@makermecrazy','Solano Confirmation Year 1 - Year 1 Retreat','20261113T173000','20261115T113000',desc,None,1,False,'retreat')
                  desc='Due May 10, 2027: Service Project Form (10 Hrs), Enrichment Sessions (15), Parent + Student Day (1), Year 1 Retreat, Root Journal, Sponsor Form.\n\n'+docs(1,True)
                  L += event('solano-y1-requirements-due-20270510@makermecrazy','Solano Confirmation Year 1 - Requirements Due','20270510','20270511',desc,None,1,True,'due1',True)
              else:
                  desc='Year 2 Retreat. Friday March 12 at 5:30 PM through Sunday March 14 at 11:30 AM. Santiago Retreat Center, 27912 Baker Canyon Rd, Silverado, CA 92676. 714-649-9800. info@santiagoretreatcenter.org. https://www.santiagoretreatcenter.org/\n\n'+docs(2)
                  L += event('solano-y2-retreat-20270312@makermecrazy','Solano Confirmation Year 2 - Year 2 Retreat','20270312T173000','20270314T113000',desc,'Santiago Retreat Center, 27912 Baker Canyon Rd, Silverado, CA 92676',2,False,'retreat')
                  desc='Due April 4, 2027: Service Project Form (10 Hrs), Enrichment Sessions (15), Parent + Student Day (1), Year 2 Retreat, Letter to the Bishop.\n\n'+docs(2,True)
                  L += event('solano-y2-requirements-due-20270404@makermecrazy','Solano Confirmation Year 2 - Requirements Due','20270404','20270405',desc,None,2,True,'due2',True)
              L += ['END:VCALENDAR']
              assert sum(x=='BEGIN:VEVENT' for x in L)==57
              return '\r\n'.join(fold(x) for x in L)+'\r\n'
          for year in (1,2):
              Path(f'Solano_Year_{year}_SUBSCRIPTION_2026-2027.ics').write_bytes(build(year).encode('utf-8'))
      - name: Commit rebuilt calendars
        run: |
          git config user.name 'MakerMeCrazy Calendar Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Solano_Year_1_SUBSCRIPTION_2026-2027.ics Solano_Year_2_SUBSCRIPTION_2026-2027.ics
          git commit -m 'Rebuild both subscription calendars with document links in every event' || exit 0
          git push