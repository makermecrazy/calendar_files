name: Publish Year 1 Calendar
on:
  push:
    paths:
      - '.github/workflows/publish-year1-calendar.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Year 1 subscription ICS
        shell: python
        run: |
          from pathlib import Path
          TZ='America/Los_Angeles'; BASE='https://raw.githubusercontent.com/makermecrazy/calendar_files/main'
          PACKET=f'{BASE}/Solano_Youth_Confirmation_Year_1_Packet_2026-2027.pdf'; CALPDF=f'{BASE}/Solano_Year_1_Calendar_2026-2027.pdf'; SPONSOR=f'{BASE}/Solano_Confirmation_Sponsorship_Instructions_and_Form.pdf'; SERVICE=f'{BASE}/Solano_Service_Project_Form.pdf'
          YOUTH='https://www.solanocatholic.org/solanoyouth'; CONF='https://www.solanocatholic.org/confirmation'; SIGNUP='https://m.signupgenius.com/#!/showSignUp/10C0A45A9A92BA2F85-63825727-meals?useFullSite=false'; EMAIL='solanoyouth@solanocatholic.org'; MATT='Matt Franklin | 949-589-1709 x2138 | mfranklin@solanocatholic.org'; SOLANO='San Francisco Solano Catholic Church, 22082 Antonio Pkwy, Rancho Santa Margarita, CA 92688'; HALL='Solano Hall - '+SOLANO; YOUTHROOM='Youth Room - '+SOLANO
          def esc(s): return str(s).replace('\\','\\\\').replace('\n','\\n').replace(',','\\,').replace(';','\\;')
          def alarm(trigger,text,absolute=False): return ['BEGIN:VALARM','ACTION:DISPLAY',(f'TRIGGER;VALUE=DATE-TIME:{trigger}' if absolute else f'TRIGGER:{trigger}'),f'DESCRIPTION:{esc(text)}','END:VALARM']
          STD=[alarm('-PT2H','Solano event in 2 hours'),alarm('-PT30M','Solano event in 30 minutes')]; RET=[alarm('-P1D','Solano Year 1 Retreat in 1 day'),alarm('-PT2H','Solano Year 1 Retreat in 2 hours')]; DUE=[alarm('20270503T160000Z','Solano Year 1 requirements due in 1 week',True),alarm('20270508T160000Z','Solano Year 1 requirements due in 2 days',True)]
          def notes(extra='',forms=False):
              p=[]
              if extra:p.append(extra)
              p += [f'Complete Year 1 packet: {PACKET}',f'Year 1 calendar PDF: {CALPDF}']
              if forms:p += [f'Service Project Form: {SERVICE}',f'Sponsorship Instructions + Form: {SPONSOR}']
              p += [f'Solano Youth: {YOUTH}',f'Confirmation: {CONF}',f'Summit service-hours signup: {SIGNUP}',f'Solano Youth email: {EMAIL}',MATT]
              return '\n'.join(p)
          def ev(uid,summary,start,end,location,desc,url,alarms,allday=False,forms=False):
              x=['BEGIN:VEVENT',f'UID:{uid}','DTSTAMP:20260913T220000Z']
              x += ([f'DTSTART;VALUE=DATE:{start}',f'DTEND;VALUE=DATE:{end}'] if allday else [f'DTSTART;TZID={TZ}:{start}',f'DTEND;TZID={TZ}:{end}'])
              x += [f'SUMMARY:{esc(summary)}']
              if location:x += [f'LOCATION:{esc(location)}']
              x += [f'DESCRIPTION:{esc(desc)}',f'URL:{url}',f'ATTACH;FMTTYPE=application/pdf:{PACKET}',f'ATTACH;FMTTYPE=application/pdf:{CALPDF}']
              if forms:x += [f'ATTACH;FMTTYPE=application/pdf:{SERVICE}',f'ATTACH;FMTTYPE=application/pdf:{SPONSOR}']
              for a in alarms:x += a
              return x+['END:VEVENT']
          c=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MakerMeCrazy//Solano Year 1 Subscription//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Solano Confirmation Year 1 + Summit 2026-2027','X-WR-TIMEZONE:America/Los_Angeles','REFRESH-INTERVAL;VALUE=DURATION:PT6H','X-PUBLISHED-TTL:PT6H','BEGIN:VTIMEZONE','TZID:America/Los_Angeles','BEGIN:DAYLIGHT','TZOFFSETFROM:-0800','TZOFFSETTO:-0700','TZNAME:PDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:-0700','TZOFFSETTO:-0800','TZNAME:PST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD','END:VTIMEZONE']
          enrich=[(1,'20260927'),(2,'20261004'),(3,'20261018'),(4,'20261025'),(5,'20261108'),(6,'20261122'),(7,'20261206'),(8,'20261213'),(9,'20261220'),(10,'20270110'),(11,'20270124'),(12,'20270131'),(13,'20270221'),(14,'20270307'),(15,'20270321'),(16,'20270404'),(17,'20270411'),(18,'20270418')]
          for n,d in enrich:c += ev(f'solano-y1-enrichment-{n}-{d}@makermecrazy',f'Solano Year 1 Enrichment #{n}',d+'T160000',d+'T180000',HALL,notes(f'Enrichment #{n}. 4:00-6:00 PM. Includes Mass. Must attend 15 enrichments.'),CONF,STD)
          summit='20260823 20260830 20260906 20260913 20260920 20260927 20261004 20261011 20261018 20261025 20261101 20261108 20261122 20261129 20261206 20261213 20261220 20270110 20270117 20270124 20270131 20270221 20270228 20270307 20270321 20270404 20270411 20270418 20270425 20270502 20270516 20270523 20270530'.split()
          for d in summit:c += ev(f'solano-y1-summit-{d}@makermecrazy','Solano Summit Youth Group',d+'T180000',d+'T203000',YOUTHROOM,notes('Summit Youth Group. 6:00-8:30 PM. Dinner is provided. Bring a meal to Summit or Garden+Garage for service hours. Students must prepare, serve and clean up, and stay for the entire Summit youth group = 5 hrs/meal.'),SIGNUP,STD)
          c += ev('solano-y1-parent-meeting-20260913@makermecrazy','Solano Year 1 Parent + Student Meeting - CHOOSE ONE - Sunday Option','20260913T113000','20260913T130000',SOLANO,notes('CHOOSE ONE meeting option. Both students and parents attend together. Sunday option: 11:30 AM-1:00 PM.'),CONF,STD)
          c += ev('solano-y1-parent-meeting-20260914@makermecrazy','Solano Year 1 Parent + Student Meeting - CHOOSE ONE - Monday Option','20260914T190000','20260914T203000',SOLANO,notes('CHOOSE ONE meeting option. Both students and parents attend together. Monday option: 7:00-8:30 PM.'),CONF,STD)
          for d in ['20261101','20270228']:c += ev(f'solano-y1-parent-day-{d}@makermecrazy','Solano Year 1 Parent + Student Day Retreat',d+'T140000',d+'T170000',SOLANO,notes('Parent + Student Day Retreat. 2:00-5:00 PM.'),CONF,STD)
          c += ev('solano-y1-retreat-20261113@makermecrazy','Solano Confirmation Year 1 - Year 1 Retreat','20261113T173000','20261115T113000',None,notes('Year 1 Retreat. Friday Nov. 13 at 5:30 PM through Sunday Nov. 15 at 11:30 AM. Location is not listed in the source packet and will be added when confirmed.'),CONF,RET)
          c += ev('solano-y1-requirements-due-20270510@makermecrazy','Solano Confirmation Year 1 - Requirements Due','20270510','20270511',None,notes('Due May 10, 2027: Service Project Form (10 Hrs), Enrichment Sessions (15), Parent + Student Day (1), Year 1 Retreat, Root Journal, Sponsor Form.',True),CONF,DUE,True,True)
          c += ['END:VCALENDAR']
          def fold(line,limit=75):
              b=line.encode(); out=[]
              while len(b)>limit:
                  cut=limit
                  while cut>0 and (b[cut]&0xC0)==0x80:cut-=1
                  out.append(b[:cut].decode()); b=b[cut:]
              out.append(b.decode()); return '\r\n '.join(out)
          Path('Solano_Year_1_SUBSCRIPTION_2026-2027.ics').write_text('\r\n'.join(fold(x) for x in c)+'\r\n',encoding='utf-8')
      - name: Commit calendar
        run: |
          git config user.name 'MakerMeCrazy Calendar Publisher'
          git config user.email 'makermecrazy@gmail.com'
          git add Solano_Year_1_SUBSCRIPTION_2026-2027.ics
          git commit -m 'Add Solano Year 1 subscription calendar' || exit 0
          git push
